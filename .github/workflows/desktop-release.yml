name: Publish prepared desktop release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
concurrency:
  group: desktop-release
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify draft downloads and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash desktop-runtime/update/publish_draft.sh
