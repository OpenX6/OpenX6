name: X6B converter
on:
  push:
    paths:
      - 'tools/x6b_to_cdng/**'
      - '.github/workflows/x6b-converter.yml'
  pull_request:
    paths:
      - 'tools/x6b_to_cdng/**'
      - '.github/workflows/x6b-converter.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --only-binary=:all: -r tools/x6b_to_cdng/requirements.txt tifffile
      - run: python -m unittest discover -s tools/x6b_to_cdng/tests -v
