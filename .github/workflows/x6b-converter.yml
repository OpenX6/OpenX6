name: X6B converter
on:
  push:
    paths:
      - 'tools/x6b_to_cdng/**'
      - '.github/workflows/x6b-converter.yml'
  pull_request:
    paths:
      - 'tools/x6b_to_cdng/**'
      - '.github/workflows/x6b-converter.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: runner.os != 'Windows'
        with:
          sparse-checkout: tools/x6b_to_cdng
      - name: Export converter source without a Windows firmware checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git init .
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git archive --format=zip --output=converter-source.zip --prefix=tools/x6b_to_cdng/ FETCH_HEAD:tools/x6b_to_cdng
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive converter-source.zip -DestinationPath .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --only-binary=:all: -r tools/x6b_to_cdng/requirements.txt tifffile
      - run: python -m unittest discover -s tools/x6b_to_cdng/tests -v
